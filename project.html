<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/fa62c117c7.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Proyecto — Isaac Ramírez</title>
  </head>
  <body class="dark" id="top">
    <header class="header center">
      <h3></h3>

      <nav class="nav center">
        <ul class="nav__list center">
          <li class="nav__list-item">
            <a class="link link--nav" href="index.html#projects">Projects</a>
          </li>
          <li class="nav__list-item">
            <a class="link link--nav" href="index.html#skills">Skills</a>
          </li>
          <li class="nav__list-item">
            <a class="link link--nav" href="index.html#contact">Contact</a>
          </li>
        </ul>

        <button type="button" aria-label="toggle theme" class="btn btn--icon">
          <i aria-hidden="true" id="btn-theme" class="fas fa-moon"></i>
        </button>

        <button
          type="button"
          aria-label="toggle navigation"
          class="btn btn--icon nav__hamburger"
        >
          <i aria-hidden="true" class="fas fa-bars"></i>
        </button>
      </nav>
    </header>

    <main>
      <div id="not-found" class="project-detail__not-found" hidden>
        <h2 class="section__title">Project not found</h2>
        <p class="section__subtitle">
          We couldn't find that project.
          <a class="link" href="index.html#projects">Back to projects</a>
        </p>
      </div>

      <article id="project-detail" class="project-detail" hidden>
        <a class="project-detail__back link" href="index.html#projects">
          <i aria-hidden="true" class="fas fa-arrow-left"></i> Back to projects
        </a>

        <h1 id="pd-title" class="project-detail__title"></h1>

        <img id="pd-hero" class="project-detail__hero" src="" alt="" />

        <!-- Description -->
        <section class="project-detail__section">
          <h2 class="section__title">Description</h2>
          <div class="project-detail__text" id="pd-desc-text"></div>

          <div class="project-detail__info-grid">
            <div class="project-detail__info-item">
              <span class="project-detail__info-label">Language</span>
              <span class="project-detail__info-value" id="pd-language"></span>
            </div>
            <div class="project-detail__info-item">
              <span class="project-detail__info-label">Engine</span>
              <span class="project-detail__info-value" id="pd-engine"></span>
            </div>
            <div class="project-detail__info-item">
              <span class="project-detail__info-label">Development time</span>
              <span class="project-detail__info-value" id="pd-devtime"></span>
            </div>
            <div class="project-detail__info-item">
              <span class="project-detail__info-label">Team size</span>
              <span class="project-detail__info-value" id="pd-team"></span>
            </div>
            <div class="project-detail__info-item">
              <span class="project-detail__info-label">Year</span>
              <span class="project-detail__info-value" id="pd-year"></span>
            </div>
          </div>
        </section>

        <!-- Role -->
        <section class="project-detail__section" id="pd-role-section">
          <h2 class="section__title">My role</h2>
          <h3 class="project-detail__role-name" id="pd-role-name"></h3>
          <div class="project-detail__text" id="pd-role-text"></div>
        </section>

        <!-- Trailer -->
        <section class="project-detail__section" id="pd-video-section">
          <h2 class="section__title">Trailer</h2>
          <div class="project-detail__video-wrap" id="pd-video-wrap">
            <iframe
              id="pd-video"
              src=""
              title="Project trailer"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
            ></iframe>
          </div>
        </section>

        <!-- Links -->
        <section class="project-detail__section project-detail__links" id="pd-links">
          <a id="pd-download" class="btn btn--outline" href="#" target="_blank">
            <i aria-hidden="true" class="fas fa-download"></i> Download
          </a>
          <a id="pd-github" class="btn btn--outline" href="#" target="_blank">
            <i aria-hidden="true" class="fab fa-github"></i> Repository
          </a>
        </section>

        <!-- Contribution -->
        <section class="project-detail__section" id="pd-contrib-section">
          <h2 class="section__title">What I contributed</h2>

          <h3 class="project-detail__contrib-title" id="pd-contrib-title-0"></h3>
          <div class="project-detail__row" id="pd-contrib-row-0">
            <div class="project-detail__media" id="pd-contrib-media-0">
              <img class="project-detail__gif" id="pd-contrib-img-0" alt="" />
            </div>
            <div class="project-detail__text" id="pd-contrib-text-0"></div>
          </div>

          <h3 class="project-detail__contrib-title" id="pd-contrib-title-1"></h3>
          <div class="project-detail__row" id="pd-contrib-row-1">
            <div class="project-detail__media" id="pd-contrib-media-1">
              <img class="project-detail__gif" id="pd-contrib-img-1" alt="" />
            </div>
            <div class="project-detail__text" id="pd-contrib-text-1"></div>
          </div>

          <h3 class="project-detail__contrib-title" id="pd-contrib-title-2"></h3>
          <div class="project-detail__row" id="pd-contrib-row-2">
            <div class="project-detail__media" id="pd-contrib-media-2">
              <img class="project-detail__gif" id="pd-contrib-img-2" alt="" />
            </div>
            <div class="project-detail__text" id="pd-contrib-text-2"></div>
          </div>
        </section>
      </article>
    </main>

    <footer class="footer">
      <p>© 2026 Isaac Ramírez</p>
    </footer>

    <div class="scroll-container">
      <div class="scroll-top">
        <a aria-label="Scroll up" href="#top">
          <i aria-hidden="true" class="fas fa-arrow-up"></i>
        </a>
      </div>
    </div>

    <script src="./script.js"></script>
    <script src="./projects-data.js"></script>
    <script src="./project.js"></script>
  </body>
</html>
